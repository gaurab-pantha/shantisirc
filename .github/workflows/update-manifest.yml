name: Update file list
on:
  push:
    paths: ["gallery/**", "news/**", "projects/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/make-manifest.py
      - run: |
          git config user.name "ssirc-bot"; git config user.email "bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || (git commit -m "Update file list" && git push)
